name: smart_orders_desktop
description: Smart Orders Desktop Application
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # API & Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Navigation
  go_router: ^13.0.0
  flutter_svg: ^2.0.9
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  
  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1
  
  cupertino_icons: ^1.0.2
  image_picker: ^1.2.1
  window_manager: ^0.5.1
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
